events {
    worker_connections 1024;
}

http {
 
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # Add server_tokens off to hide Nginx version
    server_tokens off;

    server {
        listen 80;
        server_name api.cmsai.duongminhvn.com;
        # Force redirect to HTTPS with a permanent redirect
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2; # Added http2 for performance
        server_name api.cmsai.duongminhvn.com;

        # SSL certificate paths
        ssl_certificate /etc/letsencrypt/live/api.cmsai.duongminhvn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.cmsai.duongminhvn.com/privkey.pem;

        # Modern SSL protocols and ciphers for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # Enable OCSP stapling for better SSL performance
        ssl_stapling on;
        ssl_stapling_verify on;

        # Optional: Add HSTS for enhanced security
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Add proxy buffering and timeout settings
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}