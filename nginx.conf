server {
    listen 443 ssl;
    server_name api.cmsai.duongminhvn.com;

    ssl_certificate /etc/letsencrypt/live/api.cmsai.duongminhvn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cmsai.duongminhvn.com/privkey.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://app:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}